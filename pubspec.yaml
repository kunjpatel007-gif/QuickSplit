name: campus_quicksplit
description: "Campus QuickSplit — Frictionless Local-First Peer Expense Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  provider: ^6.1.4

  crypto: ^3.0.6

  intl: ^0.20.2

  url_launcher: ^6.3.2

  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

  share_plus: ^13.3.0

  google_mlkit_text_recognition: ^0.14.0

  flutter_local_notifications: ^18.0.1
  workmanager: ^0.10.9

  home_widget: ^0.7.0
  image_picker: ^1.2.3
  app_links: ^7.2.1
  nearby_connections: ^4.3.0
  permission_handler: ^13.0.1
  nfc_manager: ^4.2.1
  uuid: ^4.6.0
  google_mlkit_entity_extraction: ^0.14.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.jpg"
  min_sdk_android: 21
